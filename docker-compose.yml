services:
  postgres:
    image: postgres:15-alpine
    container_name: sovereign_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sovereign_workbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sovereign_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: sovereign_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.15-community
    container_name: sovereign_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/sovereign2026
      NEO4J_PLUGINS: "["apoc"]"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sovereign_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data

  ollama:
    image: ollama/ollama:latest
    container_name: sovereign_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKER_USER:-himanshi2singla}/sovereign-backend:latest
    container_name: sovereign_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sovereign_workbench
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sovereign2026
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434
      DEPLOYMENT_MODE: air_gapped
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - mosquitto
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${DOCKER_USER:-himanshi2singla}/sovereign-frontend:latest
    container_name: sovereign_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_data:
  qdrant_data:
  neo4j_data:
  mqtt_data:
  ollama_data:
